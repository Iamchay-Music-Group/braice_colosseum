version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: braice-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: braice
      POSTGRES_PASSWORD: braice_secret
      POSTGRES_DB: braice_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U braice -d braice_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: braice-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  postgres_data:
