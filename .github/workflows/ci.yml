name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        # This is a pnpm workspace, so the pnpm store is what should be cached.
        cache: 'pnpm'

    - name: Install pnpm
      run: corepack enable

    # `npm ci` cannot install a pnpm workspace and has no lockfile entry for it.
    - run: pnpm install --frozen-lockfile

    - run: pnpm build
    - run: pnpm lint
    - run: pnpm typecheck
    - run: pnpm test

  rust:
    # The governance program is a separate toolchain from the API. It is built
    # and tested in its own job so a Rust failure is reported as a Rust failure
    # rather than a Node failure.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust (stable)
      run: rustup toolchain install stable --profile minimal

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('programs/**/Cargo.lock') }}

    - name: Test governance program
      working-directory: programs/braice-governance
      run: cargo test --locked

    - name: Build the BPF program and IDL
      working-directory: programs/braice-governance
      # Proves the program compiles to BPF and that the IDL the TypeScript
      # client is written against still generates.
      run: anchor build
